name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q .

      # The modules do real work at import time only if run as __main__, so
      # importing them verifies the dependency list is complete.
      - name: Import every module
        env:
          MPLBACKEND: Agg
        run: python -c "import handling, singletablehandler, multitablehandler, visualhandler"
